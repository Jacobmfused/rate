<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B3A5C;
  --blue:#2E75B6;
  --light:#E8F0F8;
  --green:#27AE60;
  --red:#C0392B;
  --gold:#D4A017;
  --shadow: 0 2px 10px rgba(27,58,92,0.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--light);
  color:var(--navy);
  -webkit-tap-highlight-color:transparent;
}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--light);
  display:flex;
  flex-direction:column;
}
#appHeader{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--navy);
  color:#fff;
  padding:14px 16px;
  box-shadow:var(--shadow);
  text-align:center;
}
#appHeader h1{
  margin:0;
  font-size:19px;
  font-weight:800;
  letter-spacing:0.5px;
}
#appHeader .sub{
  font-size:11.5px;
  color:#cfe0f2;
  margin-top:4px;
  font-weight:600;
  letter-spacing:0.3px;
}
#screen{
  flex:1;
  padding:16px 16px 40px;
}
.card{
  background:#fff;
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:14px;
}
.screenTitle{
  font-size:18px;
  font-weight:800;
  color:var(--navy);
  margin:2px 0 10px;
  text-align:center;
}
.screenSub{
  font-size:13.5px;
  color:#5a7089;
  margin-bottom:14px;
  line-height:1.4;
  text-align:center;
}
label.fieldLabel{
  display:block;
  font-size:13.5px;
  font-weight:700;
  color:var(--navy);
  margin-bottom:8px;
}
.optTag{color:#8296ac;font-weight:400;font-size:12px;}
input[type=text], textarea{
  width:100%;
  font-family:inherit;
  font-size:15px;
  padding:11px 12px;
  border:1.5px solid #c7d6e8;
  border-radius:10px;
  background:#fbfdff;
  color:var(--navy);
  margin-bottom:20px;
}
textarea{min-height:70px;resize:vertical;}
.ratingRow{display:flex;gap:6px;margin-bottom:6px;}
.ratingBtn{
  flex:1;
  height:50px;
  border-radius:10px;
  border:1.5px solid #c7d6e8;
  background:#fbfdff;
  color:#8296ac;
  font-family:inherit;
  font-weight:700;
  font-size:17px;
  cursor:pointer;
}
.ratingBtn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.ratingAnchors{display:flex;justify-content:space-between;margin-bottom:20px;font-size:11px;color:#8296ac;}
.buyRow{display:flex;gap:10px;margin-bottom:20px;}
.buyBtn{
  flex:1;
  height:48px;
  border-radius:10px;
  border:1.5px solid #c7d6e8;
  background:#fbfdff;
  color:#8296ac;
  font-family:inherit;
  font-weight:700;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:0.3px;
  cursor:pointer;
}
.buyBtn.yes.active{background:var(--green);border-color:var(--green);color:#fff;}
.buyBtn.no.active{background:var(--red);border-color:var(--red);color:#fff;}
.btn{
  display:block;
  width:100%;
  text-align:center;
  padding:14px;
  border-radius:12px;
  font-size:15.5px;
  font-weight:700;
  border:none;
  cursor:pointer;
  margin-bottom:10px;
}
.btn-primary{background:var(--navy);color:#fff;}
.btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.errorMsg{color:var(--red);font-size:13px;margin-bottom:12px;text-align:center;}
.checkIcon{
  width:56px;height:56px;border-radius:50%;
  background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;margin:0 auto 14px;
}
.savedTag{
  text-align:center;color:var(--green);font-weight:800;font-size:12.5px;
  letter-spacing:0.5px;margin-bottom:8px;
}
.deviceCallout{text-align:center;font-size:15.5px;margin-bottom:20px;}
.deviceCallout b{color:var(--gold);font-family:monospace;}
.askRow{display:flex;gap:10px;}
.askRow .btn{margin-bottom:0;}
.summaryRow{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid #e3ecf5;font-size:13.5px;
}
.summaryRow:last-child{border-bottom:none;}
.summaryCode{font-family:monospace;color:var(--gold);font-weight:700;}
.summaryRating{color:#5a7089;}
.summaryBuy{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.3px;}
.summaryBuy.yes{color:var(--green);}
.summaryBuy.no{color:var(--red);}
.statusMsg{
  font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px;
  margin-bottom:12px;text-align:center;
}
.statusMsg.ok{background:#e6f6ec;color:var(--green);}
.statusMsg.pending{background:#f2f7fc;color:var(--blue);}
</style>
</head>
<body>
<div id="app">
  <header id="appHeader">
    <h1>RATING</h1>
    <div class="sub" id="headerSub">compare two devices</div>
  </header>
  <main id="screen"></main>
</div>
<script>
/* =====================================================================
   CONFIG — same pattern as the other Sensory Test tools: point this at
   your Apps Script /exec URL. The existing apps-script.gs backend works
   as-is for this tool too (it auto-creates headers for any row shape).
===================================================================== */
var SHEETS_URL = "https://script.google.com/macros/s/AKfycbzwY8x4F4iuEU4nWLOQshHMzr3bUdhbqGK91G3TIt3Ab99szcM9hHZoUnRa_uVrMj5Y/exec";
var STORAGE_KEY = "deviceRatingSubmissions_v2";

/* =====================================================================
   STATE
===================================================================== */
function emptyDevice(){ return { deviceCode:'', rating:null, wouldBuy:null, notes:'' }; }
function emptyComparison(){ return { device1: emptyDevice(), device2: emptyDevice(), preferredCode:'' }; }
var comparison = emptyComparison();
var participantName = '';
var step = 'device1'; // device1 | device2 | preference | complete
var errorMsg = '';
var saving = false;
var lastSubmission = null;

function uid(){ return 'c_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/"/g,'&quot;'); }

/* =====================================================================
   RENDER
===================================================================== */
function render(){
  var subText = {
    device1: 'device 1 of 2',
    device2: 'device 2 of 2',
    preference: 'which one is better?',
    complete: 'comparison complete'
  }[step];
  document.getElementById('headerSub').textContent = subText;

  var html = '';
  if(step === 'device1') html = renderDeviceForm(1);
  else if(step === 'device2') html = renderDeviceForm(2);
  else if(step === 'preference') html = renderPreference();
  else if(step === 'complete') html = renderComplete();
  document.getElementById('screen').innerHTML = html;
}

function renderDeviceForm(n){
  var d = comparison['device'+n];
  var html = '<div class="card">';
  html += '<div class="screenTitle">Device '+n+'</div>';

  if(n === 1){
    html += '<label class="fieldLabel">Participant Name</label>';
    html += '<input type="text" id="participantNameInput" placeholder="Your name" value="'+esc(participantName)+'" onchange="participantName=this.value">';
  }

  html += '<label class="fieldLabel">Device Code</label>';
  html += '<input type="text" id="deviceCodeInput" placeholder="e.g. 214 or DVC-7" value="'+esc(d.deviceCode)+'" onchange="setDeviceField('+n+',\'deviceCode\',this.value)">';

  html += '<label class="fieldLabel">Rating</label>';
  html += '<div class="ratingRow">';
  for(var v=1; v<=5; v++){
    html += '<button type="button" class="ratingBtn '+(d.rating===v?'active':'')+'" onclick="setRating('+n+','+v+')">'+v+'</button>';
  }
  html += '</div>';
  html += '<div class="ratingAnchors"><span>poor</span><span>excellent</span></div>';

  html += '<label class="fieldLabel">Would you buy this product?</label>';
  html += '<div class="buyRow">';
  html += '<button type="button" class="buyBtn yes '+(d.wouldBuy===true?'active':'')+'" onclick="setWouldBuy('+n+',true)">Yes</button>';
  html += '<button type="button" class="buyBtn no '+(d.wouldBuy===false?'active':'')+'" onclick="setWouldBuy('+n+',false)">No</button>';
  html += '</div>';

  html += '<label class="fieldLabel">Notes <span class="optTag">(optional)</span></label>';
  html += '<textarea id="notesInput" placeholder="Anything else worth flagging about this device…" onchange="setDeviceField('+n+',\'notes\',this.value)">'+esc(d.notes)+'</textarea>';

  if(errorMsg){ html += '<div class="errorMsg">'+esc(errorMsg)+'</div>'; }
  var btnLabel = n===1 ? 'Next: Device 2' : 'Next: Compare';
  html += '<button class="btn btn-primary" onclick="goToNextDevice('+n+')">'+btnLabel+'</button>';
  html += '</div>';
  return html;
}

function renderPreference(){
  var d1 = comparison.device1, d2 = comparison.device2;
  var html = '<div class="card">';
  html += '<div class="screenTitle">Which One Is Better?</div>';
  html += '<div class="screenSub">You rated <b>#'+esc(d1.deviceCode)+'</b> and <b>#'+esc(d2.deviceCode)+'</b>.</div>';
  html += '<label class="fieldLabel">Enter the device code you preferred</label>';
  html += '<input type="text" id="preferredInput" placeholder="e.g. '+esc(d1.deviceCode)+'" value="'+esc(comparison.preferredCode)+'" onchange="comparison.preferredCode=this.value">';
  if(errorMsg){ html += '<div class="errorMsg">'+esc(errorMsg)+'</div>'; }
  html += '<button class="btn btn-primary" '+(saving?'disabled':'')+' onclick="submitComparison()">'+(saving?'Saving…':'Submit Comparison')+'</button>';
  html += '</div>';
  return html;
}

function renderComplete(){
  var d1 = comparison.device1, d2 = comparison.device2;
  var html = '<div class="card">';
  html += '<div class="screenTitle" style="color:var(--green);">COMPARISON COMPLETE</div>';
  html += '<div id="submitStatus" class="statusMsg pending">Sending…</div>';
  [d1, d2].forEach(function(r){
    var preferred = r.deviceCode.trim().toLowerCase() === comparison.preferredCode.trim().toLowerCase();
    html += '<div class="summaryRow">';
    html += '<span class="summaryCode">#'+esc(r.deviceCode)+(preferred?' \u2605':'')+'</span>';
    html += '<span class="summaryRating">rating '+r.rating+'/5</span>';
    html += '<span class="summaryBuy '+(r.wouldBuy?'yes':'no')+'">'+(r.wouldBuy?'would buy':'would not buy')+'</span>';
    html += '</div>';
  });
  html += '<div class="screenSub" style="margin-top:14px;">Preferred: <b style="color:var(--gold);font-family:monospace;">#'+esc(comparison.preferredCode)+'</b></div>';
  html += '<button class="btn btn-outline" style="margin-top:16px;" onclick="startOver()">Start a New Comparison</button>';
  html += '</div>';
  return html;
}

/* =====================================================================
   ACTIONS
===================================================================== */
function setDeviceField(n, key, val){ comparison['device'+n][key] = val; }
function setRating(n, v){ comparison['device'+n].rating = v; render(); }
function setWouldBuy(n, v){ comparison['device'+n].wouldBuy = v; render(); }

function validateDevice(n){
  var d = comparison['device'+n];
  if(n===1 && !participantName.trim()) return 'Enter the participant name.';
  if(!d.deviceCode.trim()) return 'Enter a device code.';
  if(!d.rating) return 'Select a rating from 1 to 5.';
  if(d.wouldBuy === null) return "Answer whether you'd buy this product.";
  if(n===2 && d.deviceCode.trim().toLowerCase() === comparison.device1.deviceCode.trim().toLowerCase()){
    return 'Device 2 needs a different code than Device 1.';
  }
  return null;
}

function goToNextDevice(n){
  var err = validateDevice(n);
  if(err){ errorMsg = err; render(); return; }
  errorMsg = '';
  step = (n===1) ? 'device2' : 'preference';
  render();
}

function validatePreference(){
  var pref = comparison.preferredCode.trim().toLowerCase();
  if(!pref) return 'Enter the device code you preferred.';
  var c1 = comparison.device1.deviceCode.trim().toLowerCase();
  var c2 = comparison.device2.deviceCode.trim().toLowerCase();
  if(pref !== c1 && pref !== c2){
    return 'That code doesn\'t match either device you rated (#'+comparison.device1.deviceCode+' or #'+comparison.device2.deviceCode+'). Please re-enter.';
  }
  return null;
}

function submitComparison(){
  var err = validatePreference();
  if(err){ errorMsg = err; render(); return; }
  errorMsg = '';
  saving = true;
  render();

  var d1 = comparison.device1, d2 = comparison.device2;
  var entry = {
    id: uid(),
    timestamp: new Date().toISOString(),
    ParticipantName: participantName.trim(),
    Device1_Code: d1.deviceCode.trim(),
    Device1_Rating: d1.rating,
    Device1_WouldBuy: d1.wouldBuy,
    Device1_Notes: d1.notes.trim(),
    Device2_Code: d2.deviceCode.trim(),
    Device2_Rating: d2.rating,
    Device2_WouldBuy: d2.wouldBuy,
    Device2_Notes: d2.notes.trim(),
    PreferredDeviceCode: comparison.preferredCode.trim()
  };

  var backup = [];
  try{ backup = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch(e){}
  backup.push(entry);
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(backup)); }catch(e){}

  lastSubmission = entry;
  saving = false;
  step = 'complete';
  render();

  fetch(SHEETS_URL, {
    method: "POST",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify({row: entry})
  }).then(function(resp){
    return resp.text().then(function(text){
      var parsed = null;
      try{ parsed = JSON.parse(text); }catch(e){}
      var el = document.getElementById('submitStatus');
      if(!el) return;
      if(parsed && parsed.ok){
        el.textContent = 'Saved to server';
        el.className = 'statusMsg ok';
      } else {
        el.textContent = 'Server rejected the data — saved locally on this device only';
        el.className = 'statusMsg pending';
      }
    });
  }).catch(function(){
    var el = document.getElementById('submitStatus');
    if(el){ el.textContent = 'Could not reach server — saved locally on this device only'; el.className='statusMsg pending'; }
  });
}

function startOver(){
  comparison = emptyComparison();
  step = 'device1';
  errorMsg = '';
  render();
}

render();
</script>
</body>
</html>
